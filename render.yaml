# Render Blueprint for the Tickify React site (static). The API lives in the Tickify repo (its own render.yaml).
services:
  - type: web
    name: tickify-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL            # baked in at build time; must be the public API address (no /api suffix)
        value: https://tickify-api.onrender.com
    routes:
      - type: rewrite                # single-page app: every path is served by index.html
        source: /*
        destination: /index.html
